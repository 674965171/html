<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>静态站点图鉴 · 行业网页模板导航</title>
<meta name="description" content="按行业归档的静态网页模板库：建筑、房产、金融、旅游、餐饮、电商、科技……点开即看效果。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f172a'/%3E%3Cpath d='M9 11h6M9 16h14M9 21h9' stroke='%23fff' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/nav.css">
</head>
<body>

<!-- ===================== 顶栏 ===================== -->
<header class="topbar">
  <div class="wrap topbar__inner">
    <a class="brand" href="./">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 7h7M4 12h16M4 17h10"/>
        </svg>
      </span>
      <span class="brand__txt">
        <span class="brand__name">静态站点图鉴</span>
        <span class="brand__sub">Static Site Gallery</span>
      </span>
    </a>

    <div class="topbar__search">
      <label class="field">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" style="width:16px;height:16px;color:var(--c-text-3);flex:none">
          <circle cx="9" cy="9" r="5.5"/><path d="M13.5 13.5L17 17"/>
        </svg>
        <input id="q" type="search" placeholder="搜索行业 / 页面类型 / 关键词…" autocomplete="off" aria-label="搜索页面">
        <kbd>/</kbd>
      </label>
    </div>

    <div class="seg" role="tablist">
      <button class="seg__btn is-on" data-status="all">全部</button>
      <button class="seg__btn" data-status="live">已上线</button>
      <button class="seg__btn" data-status="planned">规划中</button>
    </div>

    <a class="btn btn--ghost btn--sm" href="https://github.com/674965171/html" target="_blank" rel="noopener">
      <svg viewBox="0 0 16 16" fill="currentColor" style="width:14px;height:14px"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 012-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A7.99 7.99 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
      GitHub
    </a>
  </div>
</header>

<!-- ===================== 主体 ===================== -->
<div class="wrap">
  <div class="shell">

    <!-- 侧栏：行业索引 -->
    <aside class="side" id="side">
      <div class="side__label">行业索引</div>
      <div class="side__list" id="sideList"></div>
    </aside>

    <!-- 主区 -->
    <div class="main">

      <header class="hero">
        <span class="hero__eyebrow">
          <i class="dot dot--live"></i>持续更新 · 每个页面都是独立静态文件
        </span>
        <h1 class="hero__title t-display">行业静态网页<em>设计图鉴</em></h1>
        <p class="hero__desc">
          按行业归档的网页模板库。遇到某个行业要官网、要商城、要落地页，
          从这里按行业找同类版式，点开直接看效果——所有页面零依赖、可直接部署。
        </p>

        <div class="stats">
          <div class="stat"><div class="stat__num" id="stInd">0</div><div class="stat__key">行业分类</div></div>
          <div class="stat"><div class="stat__num" id="stAll">0</div><div class="stat__key">规划页面</div></div>
          <div class="stat"><div class="stat__num" id="stLive">0</div><div class="stat__key">已上线</div></div>
          <div class="stat"><div class="stat__num" id="stPlan">0</div><div class="stat__key">设计中</div></div>
        </div>
      </header>

      <div id="sections"></div>

      <div class="empty" id="empty">
        <div class="empty__ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21M8.5 11h5"/>
          </svg>
        </div>
        <div class="empty__t">没有匹配的页面</div>
        <div class="empty__d">换个关键词试试，或点顶部的「全部」查看所有行业</div>
      </div>

    </div>
  </div>
</div>

<!-- ===================== 页脚 ===================== -->
<footer class="foot">
  <div class="wrap foot__inner">
    <span>© <span id="year">2026</span> 静态站点图鉴</span>
    <span class="muted-2">·</span>
    <span>纯静态 HTML / CSS / JS，无构建、无依赖</span>
    <span class="spacer"></span>
    <a href="https://github.com/674965171/html" target="_blank" rel="noopener">仓库地址 ↗</a>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<button class="totop" id="totop" aria-label="回到顶部">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5M5 12l7-7 7 7"/>
  </svg>
</button>

<noscript>
  <div class="wrap" style="padding:40px 0">
    <p class="muted">本页的站点列表需要启用 JavaScript 才能渲染。你仍可直接访问
      <code class="t-mono">sites/&lt;站点名&gt;/index.html</code> 打开任意已完成的页面。</p>
  </div>
</noscript>

<script src="assets/js/sites.js" defer></script>
<script src="assets/js/nav.js" defer></script>
</body>
</html>
