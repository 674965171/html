name: Deploy to GitHub Pages

# 推送到 main 时自动发布；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流向 Pages 写入，并申请 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # enablement: true —— 若仓库尚未启用 Pages，这一步会自动帮你启用
      - name: 配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # 纯静态站点，无需构建；.git / .github 会被该 action 自动排除
      - name: 打包静态文件
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
