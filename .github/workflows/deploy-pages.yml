name: Deploy to GitHub Pages

# 推送到 main 时自动发布；也可在 Actions 页手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许工作流向 Pages 写入，并申请 OIDC 令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个发布任务，避免并发覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7

      # ⚠️ 这里刻意不写 enablement: true。
      # GitHub 出于安全考虑，已移除「创建 Pages 站点」的 REST API 端点，
      # GitHub App / GITHUB_TOKEN 无权创建 Pages 站点，写了必然报
      # "Resource not accessible by integration"。详见 actions/configure-pages#40。
      # 因此首次必须在仓库 Settings → Pages 里手动把 Source 选为 "GitHub Actions"，
      # 之后本步骤只需读取已有站点配置即可通过。
      - name: 读取 Pages 配置
        uses: actions/configure-pages@v6

      # 纯静态站点，无需构建；.git / .github 会被该 action 自动排除
      - name: 打包静态文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.'

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
